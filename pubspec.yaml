name: discipline
description: "Discipline: calisthenics libera e gratuita."
publish_to: 'none'
version: 1.4.0+11

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  dynamic_color: ^2.1.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  material_ui: ^1.6.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  wakelock_plus: ^1.8.1
  audioplayers: ^6.8.1
  http: ^1.6.0
  mobile_scanner: ^7.4.2
  camera: ^0.12.1
  google_mlkit_pose_detection: ^0.16.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  meta: ^1.19.0
  file_picker: ^13.1.0
  url_launcher: ^6.3.3
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# Icona e splash: si rigenerano con
#   python3 tool/make_icons.py
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: '#8F4C38'
  adaptive_icon_foreground: assets/icon/icon_foreground.png

flutter_native_splash:
  color: '#FFF8F6'
  image: assets/icon/splash.png
  color_dark: '#1A110F'
  image_dark: assets/icon/splash_dark.png
  android_12:
    color: '#FFF8F6'
    image: assets/icon/splash.png
    color_dark: '#1A110F'
    image_dark: assets/icon/splash_dark.png
  fullscreen: false

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/fonts/OFL.txt
    - assets/fonts/licenses/

  # Tutti i caratteri sono inclusi nell'app (licenza SIL OFL 1.1, vedi
  # assets/fonts/OFL.txt e assets/fonts/licenses/): nessun font viene
  # scaricato da internet mentre usi Discipline. Quelli degli stili li
  # prepara tool/make_fonts.py.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton/Anton-400.ttf
          weight: 400
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo/Archivo-400.ttf
          weight: 400
        - asset: assets/fonts/Archivo/Archivo-600.ttf
          weight: 600
        - asset: assets/fonts/Archivo/Archivo-800.ttf
          weight: 800
    - family: ArchivoBlack
      fonts:
        - asset: assets/fonts/ArchivoBlack/ArchivoBlack-400.ttf
          weight: 400
    - family: Baloo
      fonts:
        - asset: assets/fonts/Baloo/Baloo-500.ttf
          weight: 500
        - asset: assets/fonts/Baloo/Baloo-700.ttf
          weight: 700
        - asset: assets/fonts/Baloo/Baloo-800.ttf
          weight: 800
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow/Barlow-500.ttf
          weight: 500
        - asset: assets/fonts/Barlow/Barlow-600.ttf
          weight: 600
        - asset: assets/fonts/Barlow/Barlow-700.ttf
          weight: 700
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka/Fredoka-500.ttf
          weight: 500
        - asset: assets/fonts/Fredoka/Fredoka-600.ttf
          weight: 600
        - asset: assets/fonts/Fredoka/Fredoka-700.ttf
          weight: 700
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans/OpenSans-400.ttf
          weight: 400
        - asset: assets/fonts/OpenSans/OpenSans-600.ttf
          weight: 600
        - asset: assets/fonts/OpenSans/OpenSans-700.ttf
          weight: 700
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron/Orbitron-600.ttf
          weight: 600
        - asset: assets/fonts/Orbitron/Orbitron-800.ttf
          weight: 800
    - family: PlexMono
      fonts:
