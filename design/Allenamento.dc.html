<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Ritmo – Allenamento in corso</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#8F4C38}a:hover{color:#723523}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFF8F6; color: #231917; font-family: 'Figtree', system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px; padding: 8px 16px 20px">
  <header style="display: flex; align-items: center; gap: 4px; height: 64px">
    <a href="Main.dc.html" aria-label="Indietro" style="width: 48px; height: 48px; border-radius: 24px; color: #231917; display: flex; align-items: center; justify-content: center; margin-left: -8px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg></a>
    <div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
      <h1 style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 700">Spinta · Intermedio</h1>
      <span style="font-size: 13px; color: #53433F">Esercizio 2 di 5 · 12:40 trascorsi</span>
    </div>
    <button aria-label="Altre opzioni" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: transparent; color: #53433F; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-right: -8px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg></button>
  </header>

  <div role="progressbar" aria-label="Avanzamento allenamento" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100" style="display: flex; gap: 4px; height: 6px">
    <span style="flex: 30; border-radius: 3px; background: #8F4C38"></span>
    <span style="flex: 70; border-radius: 3px; background: #F5C0B1"></span>
  </div>

  <section aria-label="Timer di recupero" style="background: #FFDBD1; color: #3A0B01; border-radius: 32px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px">
    <div style="position: relative; width: 176px; height: 176px">
      <svg aria-hidden="true" width="176" height="176" viewBox="0 0 200 200">
        <g transform="rotate(-90 100 100)" fill="none" stroke-linecap="round" stroke-width="14">
          <circle cx="100" cy="100" r="88" stroke="#F5C0B1"></circle>
          <circle cx="100" cy="100" r="88" stroke="#8F4C38" stroke-dasharray="552.9" stroke-dashoffset="202.7"></circle>
        </g>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
        <span style="font-size: 14px; font-weight: 600; color: #723523">Recupero</span>
        <span style="font-size: 46px; line-height: 52px; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums">0:38</span>
        <span style="font-size: 13px; color: #723523">di 1:00</span>
      </div>
    </div>
    <div style="display: flex; gap: 8px">
      <button style="height: 40px; padding: 0 16px; border: none; border-radius: 20px; background: #FFF8F6; color: #8F4C38; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">−15 s</button>
      <button style="height: 40px; padding: 0 16px; border: none; border-radius: 20px; background: #FFF8F6; color: #8F4C38; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">+15 s</button>
      <button style="height: 40px; padding: 0 16px; border: none; border-radius: 20px; background: #FFF8F6; color: #8F4C38; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Salta</button>
    </div>
  </section>

  <section aria-label="Esercizio attuale" style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 700">{{ variantName }}</h2>
    <div style="display: flex; gap: 8px">
      <span style="height: 32px; padding: 0 12px; border-radius: 8px; background: #8F4C38; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 4px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>Serie 1</span>
      <span style="height: 32px; padding: 0 12px; border-radius: 8px; background: #8F4C38; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 4px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>Serie 2</span>
      <span style="height: 32px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 2px solid #8F4C38; color: #8F4C38; font-size: 13px; font-weight: 700; display: flex; align-items: center">Serie 3</span>
      <span style="height: 32px; padding: 0 12px; border-radius: 8px; background: #F7E4DF; color: #53433F; font-size: 13px; font-weight: 600; display: flex; align-items: center">Serie 4</span>
    </div>
  </section>

  <div style="background: #FCEAE5; border-radius: 24px; padding: 8px 8px 8px 18px; display: flex; align-items: center; gap: 8px">
    <span id="lbl-rip" style="flex: 1; font-size: 15px; font-weight: 600; color: #53433F">Ripetizioni</span>
    <div role="group" aria-labelledby="lbl-rip" style="display: flex; align-items: center; gap: 8px">
      <button aria-label="Meno ripetizioni" onClick="{{ repsDown }}" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #FFF8F6; color: #8F4C38; font-family: inherit; font-size: 22px; font-weight: 700; cursor: pointer">−</button>
      <span style="min-width: 44px; text-align: center; font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums">{{ reps }}</span>
      <button aria-label="Più ripetizioni" onClick="{{ repsUp }}" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #FFF8F6; color: #8F4C38; font-family: inherit; font-size: 22px; font-weight: 700; cursor: pointer">+</button>
    </div>
  </div>

  <section aria-label="Progressione" style="background: #FCEAE5; border-radius: 24px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
      <span style="font-size: 15px; font-weight: 600; color: #53433F">Progressione</span>
      <div style="display: flex; gap: 6px" aria-label="{{ stepLabel }}" role="img">
        <sc-for list="{{ dots }}" as="d" hint-placeholder-count="5">
          <span style="{{ d.style }}"></span>
        </sc-for>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button onClick="{{ easier }}" style="height: 44px; border: 1px solid #85736E; border-radius: 22px; background: transparent; color: #53433F; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Più facile</button>
      <button onClick="{{ harder }}" style="height: 44px; border: none; border-radius: 22px; background: #F7DCD3; color: #2C1510; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Più difficile</button>
    </div>
  </section>

  <button style="height: 60px; border: none; border-radius: 20px; background: #8F4C38; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; box-shadow: 0 2px 6px rgba(58, 11, 1, 0.18)">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>Serie completata</button>

  <div style="margin-top: auto; background: #FFF1ED; border-radius: 20px; padding: 12px 16px; display: flex; align-items: center; gap: 12px">
    <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: #F5E1A7; color: #231B00; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></span>
    <div style="display: flex; flex-direction: column; min-width: 0">
      <span style="font-size: 12px; font-weight: 600; color: #53433F">Prossimo</span>
      <span style="font-size: 15px; font-weight: 700">Dip alle parallele · 3 × 8</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { reps: 12, v: 2 };
}
renderVals() {
const s = this.state;
const names = ['Push-up sulle ginocchia', 'Push-up classici', 'Push-up diamante', 'Push-up arciere', 'Push-up a un braccio'];
return {
reps: s.reps,
variantName: names[s.v],
stepLabel: 'Variante ' + (s.v + 1) + ' di ' + names.length,
dots: names.map((_, i) => ({
style: 'width: ' + (i === s.v ? 20 : 8) + 'px; height: 8px; border-radius: 4px; background: ' + (i <= s.v ? '#8F4C38' : '#E7CBC3')
})),
repsUp: () => this.setState({ reps: s.reps + 1 }),
repsDown: () => this.setState({ reps: Math.max(1, s.reps - 1) }),
harder: () => this.setState({ v: Math.min(names.length - 1, s.v + 1) }),
easier: () => this.setState({ v: Math.max(0, s.v - 1) })
};
}
}
</script>
</body>
</html>
