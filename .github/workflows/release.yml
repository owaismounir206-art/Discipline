name: Rilascio

# Si avvia quando crei un tag di versione (es. v0.1.0) oppure a mano.
# Pubblica su GitHub Releases un APK (e un AAB per il Play Store).
#
# Segreti facoltativi (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   keystore .jks codificato in base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS
# Senza il keystore l'APK è firmato con la chiave di prova (non adatto agli
# store).
# Vedi docs/PUBBLICAZIONE.md.

on:
  push:
    tags: ['v*.*.*']
  # Avvio a mano: legge la versione da pubspec.yaml e crea lei il tag.
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  release:
    name: APK e AAB firmati
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Firma (se il keystore è nei segreti)
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ritmo-release.jks"
            {
              echo "storePassword=$STORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=$RUNNER_TEMP/ritmo-release.jks"
            } > android/key.properties
            echo "Firma di rilascio attiva."
          else
            echo "::warning::Nessun keystore: firma di prova."
          fi

      - name: Versione
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"

      - name: Compila
        run: |
          NAME="${{ steps.version.outputs.name }}"
          flutter build apk --release --build-name="${NAME%%-*}" \
            --build-number="$GITHUB_RUN_NUMBER"
          flutter build appbundle --release --build-name="${NAME%%-*}" \
            --build-number="$GITHUB_RUN_NUMBER"

      - name: Nomi e impronte dei file
        run: |
          mkdir dist
          TAG="${{ steps.version.outputs.tag }}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ritmo-$TAG.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/ritmo-$TAG.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: ritmo-release
          path: dist/
          retention-days: 30

      - name: Pubblica su GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Ritmo ${{ steps.version.outputs.name }}
          files: dist/*
          generate_release_notes: true
          # Senza keystore nei segreti l'APK è firmato con la chiave di prova.
          prerelease: ${{ env.KEYSTORE_B64 == '' }}
