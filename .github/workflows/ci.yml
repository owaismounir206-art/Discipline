name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    name: Analisi e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Formattazione
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analisi
        run: flutter analyze

      - name: Test
        run: flutter test

  apk:
    name: APK di prova
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Compila APK
        run: flutter build apk --release

      # L'APK si scarica dalla pagina dell'esecuzione, sezione "Artifacts".
      # È firmato con una chiave di prova: serve solo per provarla sul telefono.
      - uses: actions/upload-artifact@v4
        with:
          name: ritmo-apk-prova
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    name: Compilazione iOS (senza firma)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Compila per iOS
        run: flutter build ios --release --no-codesign
