name: Prova Open Food Facts (temporanea)
on:
  push:
    paths: ['.github/workflows/probe-off.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Discipline/1.0.1 (https://github.com/owaismounir206-art/Discipline)'
          for url in \
            'https://search.openfoodfacts.org/search?q=nutella&page_size=2&langs=it&fields=code,product_name,product_name_it,brands,nutriments,allergens_tags' \
            'https://it.openfoodfacts.org/cgi/search.pl?search_terms=nutella&search_simple=1&action=process&json=1&page_size=2&fields=code,product_name,product_name_it,brands,nutriments,allergens_tags' \
            'https://world.openfoodfacts.org/api/v2/search?search_terms=nutella&page_size=2&fields=code,product_name' \
            'https://world.openfoodfacts.org/api/v2/product/3017620422003?fields=code,product_name,product_name_it,brands,nutriments,allergens_tags' \
            'https://world.openfoodfacts.org/api/v2/product/0000000000000?fields=code' ; do
            echo "=== $url"
            curl -s -m 40 -A "$UA" -o out.txt -w 'HTTP %{http_code} in %{time_total}s type=%{content_type}\n' "$url"
            head -c 1500 out.txt; echo
          done
